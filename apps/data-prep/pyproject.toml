[project]
name = "data-prep"
version = "0.1.0"
description = "Flatten raw portal catalog snapshots into tidy Supabase tables, change events, and RAG chunks."
readme = "README.md"
authors = [{ name = "asenetcky", email = "me@asenetcky.dev" }]
requires-python = ">=3.13"
dependencies = [
    "polars>=1.43.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "supabase>=2.31.0",
]

[project.scripts]
data-prep = "data_prep.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "marimo>=0.23.16",
    "pytest>=9.1.0",
]
