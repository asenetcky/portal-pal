name: ETL Pipeline

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run all ETL CI jobs"
        required: false
        default: true
      run_build_and_publish:
        description: "Build and Publish Portal ETL container"
        required: false
        default: false
  release:
    type: [created]
  
jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    # env:
    #   KEY:  

    steps:
      - name: checkout-code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: setup-uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      
      - name: collect-metadata
        run: uv run ./apps/etl/src/etl/main.py
      
